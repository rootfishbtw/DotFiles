[colors]
background = #0f0f0f
foreground = #abb2bf
blue = #61afef
cyan = #56b6c2
green = #98c379
purple = #c678dd
red = #e06c75
yellow = #e5c07b
inactive = #4b5263
surface = #1c1f26

[bar/main]
width = 100%
height = 25
radius = 0
fixed-center = true
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-size = 0
padding-left = 2
padding-right = 0
module-margin = 1

font-0 = JetBrainsMono Nerd Font:style=Bold:size=9;3
font-1 = JetBrainsMono Nerd Font:size=12;4

modules-left = arch bspwm
modules-center = time
modules-right = xkeyboard pulseaudio system-info

enable-ipc = true
wm-restack = bspwm
override-redirect = false

[module/arch]
type = custom/script
exec = ~/.config/polybar/arch.sh
format-font = 2
format-foreground = #abb2bf
format-padding = 0
click-left = rofi -show drun

[module/bspwm]
type = internal/bspwm
pin-workspaces = true

label-focused = %name%
label-focused-foreground = ${colors.foreground}
label-focused-background = ${colors.surface}
label-focused-underline = ${colors.foreground}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.inactive}
label-empty-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.red}
label-urgent-padding = 2


[module/time]
type = internal/date
interval = 1
time = %H:%M:%S
label = %time%
label-foreground = ${colors.foreground}


[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = caps lock
format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${colors.foreground}


[module/system-info]
type = custom/script
exec = ~/.config/polybar/scripts/system-info.sh
tail = true

format = <label>
format-background = ${colors.surface}
format-padding = 1

label = %output%
label-foreground = ${colors.foreground}


[module/pulseaudio]
type = custom/script
exec = ~/.config/polybar/volume.sh
tail = true
format-foreground = ${colors.foreground}
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = ~/.config/polybar/vol-up.sh
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
